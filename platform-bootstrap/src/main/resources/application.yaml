server:
  port: 9081
  servlet:
    context-path: /api/rag

spring:
  # 本地直接跑 app 时自动读项目根 .env（容器部署由 compose 注入环境变量，.env 不存在则 optional 跳过）。
  # .env 格式与 properties 兼容（KEY=VALUE）；docker compose 也读同一份 .env，三方共用。
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      # 可观测性配置文件名可切换：服务器部署（docker-compose.server.yml）设 TELEMETRY_CONFIG=application-telemetry-server.yaml
      # （直连 OpenObserve、无 collector / langfuse）；本地默认 application-telemetry.yaml
      - "optional:classpath:${TELEMETRY_CONFIG:application-telemetry.yaml}"
  application:
    name: customer-platform

  servlet:
    multipart:
      max-file-size: 50MB         # 单文件最大 50MB（默认 1MB 太小）
      max-request-size: 60MB      # 单次请求最大 60MB

  datasource:
    # customer-platform 独立库，已含 pgvector 扩展；账号密码从 .env 注入（compose 经 SPRING_DATASOURCE_* 覆盖）
    url: jdbc:postgresql://localhost:5432/springai_rag
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}          # 默认空 = 无密码（本地/docker compose 的 redis 均未设 requirepass）；设了 requirepass 时在 .env 配 REDIS_PASSWORD
      timeout: 3000ms                        # 命令超时（慢命令上限）
      connect-timeout: 1s                    # 连接超时：连不上必须快速失败（断路器靠它把慢死形态的等待压到秒级内）

  sql:
    init:
      mode: always                              # 启动时执行业务表脚本（与 pgvector/chat-memory 各自的初始化互不冲突）
      schema-locations: classpath:sql/init.sql  # 幂等建 t_document / t_ingestion_task + pgvector 扩展兜底

  ai:
    # 全局 = DeepSeek（chat 直接用全局）；embedding 单独覆盖为百炼（DeepSeek 无 embedding 模型）。
    # 全局 api-key 同时给 OpenAI 全套子模型（audio/image 等未使用的）兜底，避免它们构造时缺 key 报错。
    # key 沿用 15_ragent 的值；生产环境请用环境变量 DEEPSEEK_API_KEY / BAILIAN_API_KEY 覆盖。
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.0   # 全局确定性：意图分类/查询改写等需稳定输出，避免温度导致的改写偏差使同问题检索不同资料
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${BAILIAN_API_KEY:}
        options:
          model: text-embedding-v3   # 1024 维（由 init.sql spring_ai_store_vector.embedding VECTOR(1024) 保证一致）

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always  # DatabaseInitializationMode 枚举：always/embedded/never（非 boolean）

# 阶段 3 启用（异步入库）；阶段 0 可忽略
rocketmq:
  name-server: localhost:9876
  producer:
    group: rag-producer
    send-message-timeout: 5000

# 项目自有配置（可观测性配置已移至 application-telemetry.yaml）
rag:
  mq:
    type: rocketmq            # rocketmq | redis（切换 MQ 实现；redis 走 RedisStreamMqProducer + RedisStreamIngestionConsumer）
    topic: ingestion          # RocketMQ topic / Redis stream 默认名
    consumer-group: ingestion-consumer
    stream-name: ingestion    # Redis stream key（默认同 topic）
  cache:                      # Redis 持久化缓存层（chat/cache/CacheProperties；enabled=false 一键全关）
    enabled: false            # 2026-09-17 关闭后端缓存（各层配置留档，改回 true 即恢复）
    intent:                   # 意图分类缓存（只缓存 confidence>=0.7 的成功结果）
      enabled: true
      ttl: 30m
    retrieval:                # 检索结果缓存（key=SearchContext 全参数+docver；空结果不缓存）
      enabled: true
      ttl: 10m
      admission-threshold: 2   # 频率准入：窗口内出现满 2 次才写（长尾一次性查询不进门；eval 旁路）
    logs:                     # 日志工具缓存：trace_id 精查走 logs-trace-ttl（历史不可变），时间窗查询用此 ttl
      enabled: true
      ttl: 60s
    logs-trace-ttl: 24h       # trace_id 精查专用 TTL
    answer:                   # 精确答案缓存（key=问题+范式+docver；仅 exact 匹配，语义缓存不在本期）
      enabled: true
      ttl: 6h
      admission-threshold: 2   # 频率准入：同一问题第二问起才写缓存
    embedding:                # 查询 embedding 缓存（eval 参数扫描重复 embed 的大头）
      enabled: true
      ttl: 7d
    embedding-model-tag: default  # embedding 模型标识（进 key：换模型自然失效）
    # ===== 频率策略（Sentinel-lite 滑动窗口）：freq-window 归零 = 关闭准入与热度延长（=每次 miss 都写）=====
    freq-window: 15m          # 滚动计数窗口（"最近 15 分钟出现次数"，进程内 16 槽环形桶）
    freq-max-keys: 10000      # 窗口 map 容量上限（超限先清冷 key，仍满则新 key 不计；1 万 key ≈ 1.3MB）
    hot-threshold: 5          # 热度一档：窗口计数 >=5，命中时 TTL ×hot-multiplier
    hot-multiplier: 4
    hotter-threshold: 20      # 热度二档（顶格）：>=20 时 TTL ×max-ttl-multiplier
    max-ttl-multiplier: 10
    # ===== 断路器（Redis 熔断联动动态限流）：连续失败跳 OPEN 冷却，半开探测恢复 =====
    circuit:
      failure-threshold: 5    # 连续失败次数阈值
      cooldown: 30s           # OPEN 冷却时长（期满转半开放探测）
    # ===== 语义答案缓存（pgvector 相似问题命中；失效靠 docver+清理，无反馈机制）=====
    semantic:
      enabled: true
      threshold: 0.95         # 相似度阈值（cosine）——收很紧防"相似≠同义"误命中
      ttl: 7d                 # 行过期（概率清理任务删除依据）
      max-rows: 1000          # 容量上限（超出按 update_time 裁剪最旧）
  chat:
    top-k: 10           # 兜底召回条数（预算未配置时用）；三段预算已在下方显式配置
    context-top-k: 10   # ③ Rerank 后最终给 LLM 的条数（对齐 ragent default-top-k:10；8 会让代码块与概念块抢名额，个别代码块只给路径引用）
    recall-budget: 20   # ① 每通道召回基数（对齐 ragent；100 全库概述噪声淹没步骤块，20 噪声少）
    candidate-limit: 40 # ② RRF 融合后送 Rerank 的候选池上限（对标 ragent rag.search.fusion.rerank-candidate-limit:40）
    similarity-threshold: 0.0   # 不过滤（0.35 会把具体操作步骤块误过滤——步骤和"流程"查询语义距离较远）（阈值过滤向后推到精排环节）
    degrade-limit: 8            # Redis 断路器降级期间，昂贵路径（LLM 流式/ops 诊断）并发上限（DegradeGuard）
    diagnose-min-confidence: 0.6 # 意图路由进诊断的置信度门槛：自动档低于此值不劫持，落回知识检索（显式选择不受限）
    # system-prompt 已迁至 prompts/chat/pipeline/rag-answer-system.md（单一来源）；
    # 如需运维覆盖，可在此设置 system-prompt: xxx
    agent:                       # 多范式可插拔 agent 框架（rag.chat.agent.* → AgentProperties）
      paradigm: knowledge        # 默认 agent 范式：knowledge / ops_diagnose / react_loop（旧 naive/react 自动映射）
      grade-threshold: 0.5       # grade 相关性阈值（chunk score >= 该值视为 relevant）
      react-max-steps: 6         # ReAct 最大循环步数（防死循环硬上限）
      tool-call-mode: native     # 工具循环协议：native=原生 function calling；json=JSON 决策降级逃生门
      default-max-steps: 4       # 阶段默认循环步数
      max-invalid-tool-calls: 2  # 连续非法工具调用（幻觉工具名/参数损坏）上限，超出强制出环
      loop-call-timeout-seconds: 60  # 单次 LLM 调用超时（秒）
      session-ttl-minutes: 60    # 追问会话状态 TTL（所有 workflow agent 通用；未配置回退 ops.session-ttl-minutes）
      ops:                       # 运维诊断 agent（ops_diagnose）专属配置
        prod-confirm-required: true  # 生产环境写操作需用户确认
        stages: []               # 阶段骨架覆盖（空=代码默认：investigate_logs→resolve_request→verify）
      mcp:                       # MCP server 接入（rag.chat.agent.mcp.* → agent/mcp/McpToolProvider）
        enabled: false           # true 时把 MCP server 工具桥接进 ToolRegistry（需先配 spring.ai.mcp.client.servers）
        tool-prefix: mcp_        # MCP 工具名前缀（防与本地工具重名——注册表重名启动失败）
    # MCP server 配置示例（spring.ai.mcp.client.enabled 须同时为 true；SSE 传输示例）：
    # spring.ai.mcp.client:
    #   enabled: true
    #   type: SYNC
    #   toolcallback:
    #     enabled: true
    #   sse:
    #     connections:
    #       ops-tools:
    #         url: ${MCP_SERVER_URL:http://localhost:8081}
    #         sse-endpoint: /sse
  search:
    channels:
      keyword:
        enabled: true           # 关键词通道：metadata.keywords 双向包含匹配 + doc_name 文档路由（专有名词/人名精确召回，补向量语义弱信号）
        mode: bm25             # 实现选择：sql=滑窗字词 SQL 检索（默认，零依赖；全表扫描无索引，当前 327 块毫秒级）
                               #          bm25=pg_search 扩展检索（真 BM25+倒排，0.25.x 版；需先装扩展并建索引，
                               #               见 Bm25KeywordSearchChannel 类注释；扩展/索引缺失时自动降级为空结果）
        bm25:
          index-name: rag_keyword_bm25   # pg_bm25 模式下的 BM25 索引名（CREATE INDEX ... USING bm25）
      web-search:
        enabled: false         # 联网检索通道（需配置 API key）
    fusion:
      rrf-k: 20                # RRF 融合平滑常数（对齐 ragent 20；调小→头部排名权重更突出、多通道更容易出头）
  rerank:
    enabled: true               # Rerank 精排（百炼 qwen3-rerank；gte-rerank 已于 2026-05 下线）
    min-relevance-score: 0.3    # Rerank 相关度下限：低于此分的块不进 LLM 上下文（0=关闭）
                                # 大块时代适配：块合并到 600-1600 字符后"部分相关"块（含表格/代码的混合块）
                                # rerank 打分被稀释（0.3~0.45 区间），0.4 会砍掉表格类查询的一半上下文
                                # （实测"如何提升表格检索的效果"：0.4→输出 5 条 / 0.3→输出 10 条满额）
    bailian:
      # 注意：此处须到 /services/rerank/text-rerank，由 BaiLianRerankClient 再拼 /text-rerank，
      # 最终为双段 .../services/rerank/text-rerank/text-rerank（官方 2026 新版端点）。
      # 旧值只到 /rerank 拼出单段，全部 rerank 调用 400（task can not be null）静默退化回向量序。
      base-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank
      api-key: ${BAILIAN_API_KEY:}  # 复用 embedding 的百炼 key
      model: qwen3-rerank
  ingestion:
    chunk-size: 512       # 单块目标字符数（对齐 ragent 512；结构感知分块合并上限）
    chunk-overlap: 200    # 相邻块重叠字符数：跨块边界的答案需在上下块都完整出现，零重叠会直接损失召回
  eval:
    ks: [5, 10]           # Recall/Precision/nDCG 计算的 k 值（产出 recall_at_5 / recall_at_10 ...）
    concurrency: 8        # 跑批并发数（虚拟线程 + Semaphore 限流，单实例）
    langfuse:             # 评测结果推送 Langfuse（LangfusePushSink；凭据复用 telemetry.langfuse.*）
      enabled: true       # false = 只落库不外推；无凭据环境（服务器部署）自动 no-op
      dataset-prefix: ""  # Langfuse dataset 名前缀（默认与本地数据集同名；多环境共用 Langfuse 时隔离）
  vlm:
    # VLM 图片描述（双文本策略核心）：图片块入库时用多模态模型生成描述，description 进 embedding、
    # 原图 URL 留 content——否则图片块是纯 URL 噪声、检索永远命中不了（图片密集文档如发票截图完全不可检索）。
    # DeepSeek chat 不支持图片输入，VLM 走独立 vlmChatClient（百炼 qwen-vl）。
    enabled: true
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    api-key: ${BAILIAN_API_KEY:}
    model: qwen-vl-max
    fail-on-error: false   # true=VLM 失败中断该文档入库（对齐 ragent 原子性，绝不产残缺数据）
  storage:
    type: s3
    kb-bucket: customer-platform-kb
    asset-bucket: customer-platform-assets
    s3:
      endpoint: http://localhost:9000
      access-key: ${RUSTFS_ACCESS_KEY:rustfsadmin}
      secret-key: ${RUSTFS_SECRET_KEY:rustfsadmin}
      region: us-east-1
      path-style: true

# ===== MinerU（PDF/Word/PPT 结构化解析）=====
# 从 15_ragent 迁移：固定 API key + 并发数降至 5
mineru:
  api-url: https://mineru.net/api/v4
  api-key: ${MINERU_API_KEY:}
  poll-interval-seconds: 5
  timeout-seconds: 300
  enable-table: true
  enable-formula: true
  ocr: false
  language: ch
  concurrency-limit: 5
  semaphore-name: rag:mineru:parse
  max-wait-seconds: 30
  lease-seconds: 900

logging:
  level:
    # 服务器实测：DEBUG 下 MyBatis 每条 SQL + Spring AI 每次 prompt 全量入日志，
    # 叠加遥测后单包 5~8MB，直接打满磁盘 I/O。生产/服务器统一 INFO，排查时再临时开 DEBUG。
    org.springframework.ai: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.apache.ibatis: INFO
    com.jjx.customer.platform: INFO
    # 遥测步骤日志（llm-observability 的 telemetry.telemetry logger，step.input/output 大 JSON）。
    # 评测跑批期间每条 item 产生 20+ 条（单条最大 8KB），是服务器磁盘 I/O 的主要写入源之一；
    # 注意：这些日志同时经 OPEN_TELEMETRY appender 进 OpenObserve，关闭后 OO 内对应的
    # step 输入/输出明文展示会缺失（span 本身仍在）。跑批时可设 TELEMETRY_STEP_LOG_LEVEL=OFF。
    telemetry.telemetry: ${TELEMETRY_STEP_LOG_LEVEL:INFO}
