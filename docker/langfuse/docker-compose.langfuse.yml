# Langfuse v3 自托管（独立 compose project，不污染主 docker-compose.yml）。
# 启动：  docker compose -f docker/langfuse/docker-compose.langfuse.yml up -d
# 访问：  http://localhost:3000   登录 admin@rageoffer.com / RagAdmin@2026
# OTLP：  主 compose 的 otel-collector 经 rag-obs 网络打到 langfuse-web:3000/api/public/otel
#
# 前置：  docker network create rag-obs   （一次性；主 compose 的 collector 也挂此网络）
# 停止：  docker compose -f docker/langfuse/docker-compose.langfuse.yml down
# 清数据：docker compose -f docker/langfuse/docker-compose.langfuse.yml down -v

name: langfuse

services:
  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    restart: unless-stopped
    depends_on: &lf-deps
      postgres:   { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis:      { condition: service_healthy }
      minio:      { condition: service_started }
    ports: ["3000:3000"]
    networks: [default, rag-obs]   # rag-obs 让主 compose 的 collector 能按名 langfuse-web 解析
    environment: &lf-env
      NEXTAUTH_URL: http://localhost:3000          # 必须等于浏览器访问地址含端口
      NEXTAUTH_SECRET: lf-nextauth-secret-2026-dev  # 开发自托管占位；生产换随机
      SALT: lf-salt-2026-dev
      ENCRYPTION_KEY: a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90  # 64hex(32字节)开发固定值；生产 openssl rand -hex 32
      DATABASE_URL: postgresql://postgres:lfpg@postgres:5432/postgres
      TELEMETRY_ENABLED: "false"                    # 关闭 Langfuse 自身向官方回传用量
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: lfch
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: lfredis
      # 不预置 LANGFUSE_INIT_*（实测 web 卡在 "Running init scripts..." 不监听 3000）；
      # 首启在 http://localhost:3000 注册第一个 admin 账号 → 建 org/project → Settings → API Keys 拿 pk-lf/sk-lf。

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: *lf-deps
    networks: [default]
    environment: *lf-env

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    networks: [default]
    environment:
      CLICKHOUSE_DEFAULT_DATABASE: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: lfch
      TZ: UTC
    volumes:
      - lf_clickhouse_data:/var/lib/clickhouse
      - lf_clickhouse_logs:/var/log/clickhouse-server
    # 不映射宿主端口：避开主 compose rustfs 的 0.0.0.0:9000；langfuse 经 default 网络访问 clickhouse:8123/9000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/minio/minio:latest
    restart: unless-stopped
    networks: [default]
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports: ["9090:9000"]   # 宿主 9090 避开主 compose rustfs 的 9000
    volumes:
      - lf_minio_data:/data

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    networks: [default]
    command: ["--requirepass", "lfredis", "--maxmemory-policy", "noeviction"]
    volumes:
      - lf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "lfredis", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    networks: [default]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lfpg
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - lf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  lf_postgres_data:
  lf_clickhouse_data:
  lf_clickhouse_logs:
  lf_minio_data:
  lf_redis_data:

networks:
  default:
  rag-obs:
    external: true
