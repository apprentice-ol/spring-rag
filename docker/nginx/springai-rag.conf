# springai-rag 对外入口（服务器 80 端口）
# - /api/rag/  → 容器 app（宿主 9081），SSE 流式对话
# - /storage/ → 容器 rustfs（宿主 9000），图片等对象存储公网地址
server {
    listen 80 default_server;
    server_name _;

    # 文档上传（PDF/Office 可较大）
    client_max_body_size 200m;

    # ---- RAG 应用（前端静态 + API 都由 app 出）----
    location /api/rag/ {
        proxy_pass http://127.0.0.1:9081/api/rag/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE 关键：关缓冲，事件即产即发；长超时覆盖诊断/多步生成
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- RustFS 对象存储（/storage/customer-platform-assets/{key}）----
    location /storage/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        client_max_body_size 200m;
    }
}
